<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Services</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7fb;color:#1e293b;font:15px Segoe UI,Arial,sans-serif}header{background:linear-gradient(120deg,#0f3b5d,#168aad);color:white;text-align:center;padding:28px 15px}header h1{margin:0}header p{color:#d9f2ff;margin:8px 0 0}nav{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;background:white;padding:13px;border-bottom:1px solid #dce6ee}nav a{padding:9px 12px;border-radius:8px;text-decoration:none;color:#334155;font-size:13px;font-weight:650}nav a:hover,nav a.active{background:#e7f5fb;color:#0877a5}main{max-width:1050px;width:calc(100% - 30px);margin:30px auto 50px}.card{background:white;padding:28px;border:1px solid #dce6ee;border-radius:17px;box-shadow:0 10px 30px #0f172a0c}h2{color:#123b59;margin:0 0 8px}.sub{color:#64748b;margin:0 0 22px;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}.menu{display:block;padding:20px;border:1px solid #dce6ee;border-radius:13px;text-decoration:none;color:#1e293b;font-weight:700}.menu:hover{background:#f5fbfe;border-color:#80cde5}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:flex;flex-direction:column;gap:7px}label{font-size:13px;font-weight:700}input,select,textarea{padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;width:100%}textarea{min-height:85px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button,.btn{border:0;border-radius:9px;padding:11px 16px;background:#0877a5;color:white;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;font-size:13px}.secondary{background:#eaf1f6;color:#334155}.tablewrap{overflow:auto;border:1px solid #dce6ee;border-radius:10px;margin-top:18px}table{width:100%;border-collapse:collapse;min-width:680px}th,td{padding:12px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:13px}th{background:#eaf6fb;color:#14516e}tr:last-child td{border:0}.msg{display:none;background:#eaf6fb;color:#14516e;padding:11px;border-radius:8px;margin-top:12px;font-size:13px}footer{text-align:center;color:#94a3b8;font-size:12px;padding:0 15px 25px}@media(max-width:620px){.form{grid-template-columns:1fr}.card{padding:20px}nav a{font-size:11px;padding:8px}}</style></head><body><header><h1>Laundry Service Management System</h1><p>Clean clothes, organized orders and simple payments</p></header><nav><a class="" href="index.html">Dashboard</a><a class="" href="customers.html">Customers</a><a class="active" href="services.html">Services</a><a class="" href="newOrder.html">New Order</a><a class="" href="orders.html">Orders</a><a class="" href="updateOrder.html">Update Status</a><a class="" href="payments.html">Payments</a></nav><main><section class="card"><h2>Laundry Services</h2><p class="sub">Available services and their price per kilogram.</p><div class="tablewrap"><table><thead><tr><th>ID</th><th>Service</th><th>Price per KG</th><th>Description</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><footer>Laundry Service Management System</footer><script>
fetch('/services').then(r=>r.json()).then(d=>document.getElementById('rows').innerHTML=d.map(x=>`<tr><td>${x.service_id}</td><td>${x.service_name}</td><td>₹${Number(x.price_per_kg).toFixed(2)}</td><td>${x.description||''}</td></tr>`).join('')||'<tr><td colspan="4">No services found</td></tr>').catch(e=>alert(e.message));
</script></body></html>
